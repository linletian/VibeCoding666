<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>VibeCoding666</title>
  <link rel="stylesheet" href="keyboard-vertical.css">
</head>
<body data-layout="vertical">
  <div class="keyboard-container" id="keyboardContainer">
    <div class="controls-top">
      <button class="control-btn minimize" id="minimizeBtn" title="Minimize">−</button>
      <button class="control-btn config" id="configBtn" title="Configure">⚙</button>
      <button class="control-btn close" id="closeBtn" title="Close">×</button>
    </div>
    <div class="product-name">VC666</div>
    <div class="keyboard-keys" id="keyboardKeys"></div>
  </div>
  <script src="keyboard-common.js"></script>
</body>
</html>
